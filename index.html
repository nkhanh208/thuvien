<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Thư Viện High-Tech (Transparent)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        digital: ['Share Tech Mono', 'monospace'],
                    },
                    colors: {
                        card: '#ffffff',
                        neonBlue: '#0891b2',
                        neonPurple: '#7c3aed',
                        neonGreen: '#059669',
                        neonRed: '#e11d48',
                    }
                }
            }
        }
    </script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none; 
            -moz-user-select: none;    
            -ms-user-select: none;     
        }
        
        body {
            /* QUAN TRỌNG: Đặt nền trong suốt để hiện nền web của bạn */
            background-color: transparent; 
            color: #1e293b; 
        }

        /* Tùy chỉnh thanh cuộn cho gọn */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* CHAT BUBBLE */
         #chat-bubble { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; background: #4f46e5; border-radius: 50%; color: white; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: grab; box-shadow: 0 12px 30px rgba(79, 70, 229, 0.3); z-index: 9999; transition: transform 0.25s ease; } #chat-bubble:active { cursor: grabbing; transform: scale(0.95); }
        
        /* GLASS PANEL CHO NỀN TRẮNG */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.8); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        /* CHAT BOX */
        #chat-box { position: fixed; width: 340px; height: 430px; bottom: 100px; right: 24px; background: white; border-radius: 18px; box-shadow: 0 20px 45px rgba(0,0,0,0.15); overflow: hidden; z-index: 9999; opacity: 0; transform: scale(0.9) translateY(20px); pointer-events: none; transition: all 0.35s ease; } #chat-box.active { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; } #chat-box iframe { width: 100%; height: 100%; border: none; }

        /* FLASH EFFECT KHI CẬP NHẬT */
        .data-updated {
            border-color: #0891b2 !important;
            box-shadow: 0 0 15px rgba(8, 145, 178, 0.2) !important;
            background: #ffffff !important;
        }

        .glow-bar {
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.3);
        }

        /* ĐỒNG HỒ */
        .tech-clock-frame {
            position: relative;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }
        .tech-clock-frame::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0, 0, 0, 0.02) 1px, rgba(0, 0, 0, 0.02) 2px);
            pointer-events: none;
        }
        .corner-bracket {
            position: absolute; width: 10px; height: 10px; border-color: #0891b2; border-style: solid;
        }
        .cb-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .cb-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
        .cb-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
        .cb-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

        /* BIỂU ĐỒ TRÒN */
        .donut-chart {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: conic-gradient(#10b981 0% 0%, #f59e0b 0% 0%, #f43f5e 0% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
            transition: all 1s ease-out;
        }
        
        .donut-hole {
            width: 140px;
            height: 140px;
            background: #ffffff; /* Lỗ tròn trắng */
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        .loading-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .4; }
        }
    </style>
</head>
<body class="p-6 min-h-screen font-sans">

    <!-- Chat Bubble -->
    <div id="chat-bubble">🤖</div>

    <!-- Chat Box -->
    <div id="chat-box">
        <iframe src="https://nkhanh208.github.io/chatbot//"></iframe>
    </div>
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-8 border-b border-slate-200 pb-6">
        <div>
            <div class="flex items-center gap-2 mb-1">
                <span class="relative flex h-3 w-3">
                  <span id="status-dot" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-neonBlue opacity-75"></span>
                  <span id="status-dot-static" class="relative inline-flex rounded-full h-3 w-3 bg-neonBlue"></span>
                </span>
                <span id="system-status" class="text-neonBlue text-xs font-mono tracking-widest uppercase font-bold">REALTIME CONNECTED</span>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">THƯ VIỆN SỐ <span class="text-transparent bg-clip-text bg-gradient-to-r from-neonBlue to-neonPurple">DASHBOARD</span></h1>
        </div>
        
        <!-- Clock -->
        <div class="text-right hidden md:block">
            <div class="tech-clock-frame">
                <div class="corner-bracket cb-tl"></div>
                <div class="corner-bracket cb-tr"></div>
                <div class="corner-bracket cb-bl"></div>
                <div class="corner-bracket cb-br"></div>
                
                <div class="text-[10px] text-slate-400 font-mono tracking-widest uppercase mb-1 font-bold">System Time / UTC+7</div>
                <div id="realtime-clock" class="text-5xl font-digital text-slate-800 tracking-widest leading-none">--:--:--</div>
                <div id="realtime-date" class="text-[11px] text-slate-500 font-mono mt-2 tracking-widest border-t border-slate-200 pt-1 uppercase">--/--/----</div>
            </div>
        </div>
    </div>

    <!-- Scorecards (Đã đổi thành grid-cols-3 để phù hợp với 3 loại dữ liệu) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        
        <!-- Thẻ: Đang mượn -->
        <div id="card-active" class="glass-panel p-6 rounded-2xl relative overflow-hidden group hover:shadow-lg bg-white/60">
            <div class="absolute top-0 right-0 p-4 opacity-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477-4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
            </div>
            <div class="text-slate-500 text-xs font-mono uppercase tracking-wider mb-2 font-bold">Đang mượn</div>
            <div id="val-active" class="text-4xl font-bold text-slate-800 font-mono loading-pulse">---</div>
            <div class="text-amber-600 text-xs mt-2 font-mono font-bold">● Đang lưu hành</div>
        </div>

        <!-- Thẻ: Đã trả -->
        <div id="card-returned" class="glass-panel p-6 rounded-2xl relative overflow-hidden group hover:shadow-lg bg-white/60">
            <div class="absolute top-0 right-0 p-4 opacity-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-neonGreen" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
            <div class="text-slate-500 text-xs font-mono uppercase tracking-wider mb-2 font-bold">Đã trả xong</div>
            <div id="val-returned" class="text-4xl font-bold text-slate-800 font-mono loading-pulse">---</div>
            <div id="percent-returned" class="text-neonGreen text-xs mt-2 font-mono font-bold">--% Hoàn thành</div>
        </div>

        <!-- Thẻ: Quá hạn -->
        <div id="card-overdue" class="glass-panel p-6 rounded-2xl relative overflow-hidden group hover:shadow-lg border-red-100 bg-red-50/50">
             <div class="absolute -inset-0.5 bg-gradient-to-r from-red-500 to-orange-500 rounded-2xl blur opacity-5 group-hover:opacity-10 transition duration-1000"></div>
            <div class="relative h-full flex flex-col justify-center">
                <div class="text-red-500 text-xs font-mono uppercase tracking-wider mb-2 flex justify-between font-bold">
                    QUÁ HẠN
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                </div>
                <div id="val-overdue" class="text-4xl font-bold text-red-600 font-mono loading-pulse">---</div>
                <div class="text-red-400 text-xs mt-2 font-mono font-bold">Cần xử lý gấp!</div>
            </div>
        </div>
    </div>

    <!-- Charts Area -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Top Books -->
        <div class="glass-panel p-6 rounded-2xl md:col-span-2 bg-white/60">
            <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                <h2 class="text-lg font-bold text-slate-800 flex items-center">
                    <span class="w-1.5 h-6 bg-neonBlue mr-3 rounded-full shadow-sm"></span>
                    TOP 5 SÁCH HOT 🔥
                </h2>
                <span class="text-[10px] font-mono text-slate-400 bg-slate-50 px-2 py-1 rounded border border-slate-200 uppercase font-bold tracking-tighter">Auto Syncing</span>
            </div>
            <div id="top-books-container" class="space-y-6">
                <div class="text-center text-slate-400 py-10 loading-pulse">Đang tải dữ liệu...</div>
            </div>
        </div>

        <!-- Donut Chart -->
        <div class="glass-panel p-6 rounded-2xl flex flex-col items-center justify-between bg-white/60">
            <div class="w-full border-b border-slate-100 pb-4 mb-4">
                <h2 class="text-lg font-bold text-slate-800 flex items-center">
                    <span class="w-1.5 h-6 bg-neonPurple mr-3 rounded-full shadow-sm"></span>
                    TRẠNG THÁI
                </h2>
            </div>
            <div id="donut-chart-viz" class="donut-chart mb-4 border-4 border-white/50">
                <div class="donut-hole">
                    <span id="donut-total" class="text-4xl font-bold text-slate-800 font-mono">---</span>
                    <span class="text-[10px] text-slate-400 uppercase tracking-widest mt-1 font-bold">Total Files</span>
                </div>
            </div>
            <div class="w-full space-y-2 mt-2">
                <div class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-50 transition">
                    <div class="flex items-center">
                        <div class="w-2.5 h-2.5 rounded-full bg-neonGreen mr-3"></div>
                        <span class="text-sm font-medium text-slate-600">Đã trả</span>
                    </div>
                    <span id="donut-percent-returned" class="text-sm font-bold font-mono text-slate-800">--%</span>
                </div>
                <div class="flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-50 transition">
                    <div class="flex items-center">
                        <div class="w-2.5 h-2.5 rounded-full bg-amber-500 mr-3"></div>
                        <span class="text-sm font-medium text-slate-600">Đang mượn</span>
                    </div>
                    <span id="donut-percent-active" class="text-sm font-bold font-mono text-slate-800">--%</span>
                </div>
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-red-50 border border-red-100">
                    <div class="flex items-center">
                        <div class="w-2.5 h-2.5 rounded-full bg-neonRed mr-3 animate-pulse"></div>
                        <span class="text-sm font-medium text-red-700">Quá hạn</span>
                    </div>
                    <span id="donut-percent-overdue" class="text-sm font-bold font-mono text-red-700">--%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* CHAT BUBBLE LOGIC */
        const bubble = document.getElementById("chat-bubble");
        const box = document.getElementById("chat-box");
        bubble.addEventListener("click", () => { box.classList.toggle("active"); });

        let isDragging = false;
        let offsetX, offsetY;
        bubble.addEventListener("mousedown", (e) => {
            isDragging = true;
            offsetX = e.clientX - bubble.offsetLeft;
            offsetY = e.clientY - bubble.offsetTop;
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;
            bubble.style.left = e.clientX - offsetX + "px";
            bubble.style.top = e.clientY - offsetY + "px";
            bubble.style.right = "auto";
            bubble.style.bottom = "auto";
            box.style.left = bubble.offsetLeft - 280 + "px";
            box.style.top = bubble.offsetTop - 450 + "px";
        });

        document.addEventListener("mouseup", () => { isDragging = false; });

        // ===== CẬP NHẬT URL PUBLISH CSV MỚI NHẤT =====
        // Đã bổ sung tham số "gid=1461881900" và "single=true" để BẮT BUỘC Google trả về đúng tab Thống kê
        const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSBheU1Zxps0sQ0DTdJtRzbaFE3Wm2g-vr8mO4GYKmr9raDtKET7xpOnnTcygnkkKGHwx7LzJBETL72/pub?gid=1461881900&single=true&output=csv';
        
        let countdown = 5;

        async function fetchData() {
            try {
                // Thêm parameter random để tránh bị trình duyệt lưu cache
                const noCacheURL = `${URL}&_=${new Date().getTime()}`;
                const response = await fetch(noCacheURL);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                // Lấy nội dung text thuần (CSV)
                const text = await response.text();
                
                // Parse CSV thành mảng Array 2 chiều
                const rows = parseCSV(text);
                if (rows.length < 2) throw new Error("Bảng tính chưa có đủ dữ liệu.");

                // Row 1 (Dòng 2 trong Sheet) chứa dữ liệu mượn/trả
                const dataRow = rows[1];
                
                // Lấy dữ liệu Đang mượn (Cột B = index 1), Đã trả (Cột C = index 2), Quá hạn (Cột D = index 3)
                const active = parseInt(dataRow[1]) || 0;
                const returned = parseInt(dataRow[2]) || 0;
                const overdue = parseInt(dataRow[3]) || 0;
                
                // Tự tính tổng lượt mượn để sử dụng cho biểu đồ tròn
                const total = active + returned + overdue;

                // Cập nhật giao diện 3 thẻ
                updateValueWithFlash('card-active', 'val-active', active);
                updateValueWithFlash('card-returned', 'val-returned', returned);
                updateValueWithFlash('card-overdue', 'val-overdue', overdue);
                
                // Biểu đồ tròn
                document.getElementById('donut-total').innerText = total;
                const pctReturned = total > 0 ? Math.round((returned / total) * 100) : 0;
                const pctActive = total > 0 ? Math.round((active / total) * 100) : 0;
                const pctOverdue = total > 0 ? Math.round((overdue / total) * 100) : 0;

                document.getElementById('percent-returned').innerText = `${pctReturned}% Hoàn thành`;
                document.getElementById('donut-percent-returned').innerText = `${pctReturned}%`;
                document.getElementById('donut-percent-active').innerText = `${pctActive}%`;
                document.getElementById('donut-percent-overdue').innerText = `${pctOverdue}%`;

                const degReturned = pctReturned; 
                const degActive = pctReturned + pctActive;
                document.getElementById('donut-chart-viz').style.background = `conic-gradient(#10b981 0% ${degReturned}%, #f59e0b ${degReturned}% ${degActive}%, #f43f5e ${degActive}% 100%)`;

                // Cập nhật Danh sách Sách Hot
                const bookContainer = document.getElementById('top-books-container');
                bookContainer.innerHTML = ''; 
                const validBooks = [];
                
                // Lấy dữ liệu sách hot từ Cột E (index 4) và Cột F (index 5)
                // Chạy vòng lặp từ i = 1 (Tương ứng dòng 2 trong Sheet vì đã bỏ qua dòng Header i=0)
                for (let i = 1; i < Math.min(rows.length, 25); i++) {
                    const r = rows[i];
                    if (r && r.length > 4) {
                        const nameCell = r[4] ? r[4].trim() : ""; 
                        const countCell = parseInt(r[5]);         
                        
                        if (!isNaN(countCell) && countCell > 0 && nameCell !== "") {
                            validBooks.push({ name: nameCell, count: countCell });
                        }
                    }
                }
                
                validBooks.sort((a, b) => b.count - a.count);
                const top5 = validBooks.slice(0, 5);
                let maxCount = top5.length > 0 ? top5[0].count : 0;

                if (top5.length > 0) {
                    top5.forEach((book, index) => {
                        const widthPct = maxCount > 0 ? (book.count / maxCount) * 100 : 0;
                        const opacity = 1 - (index * 0.15); 
                        bookContainer.innerHTML += `
                        <div class="group">
                            <div class="flex justify-between text-sm mb-2">
                                <span class="font-bold text-slate-700 group-hover:text-neonBlue transition-colors truncate w-3/4">${book.name}</span>
                                <span class="font-mono font-bold text-neonBlue">${book.count}</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                <div class="bg-gradient-to-r from-neonBlue to-blue-500 h-2.5 rounded-full glow-bar relative transition-all duration-1000" style="width: ${widthPct}%; opacity: ${opacity}"></div>
                            </div>
                        </div>`;
                    });
                } else {
                     bookContainer.innerHTML = '<div class="text-center text-slate-400 py-4 font-mono">Chưa có dữ liệu sách hot</div>';
                }

                document.getElementById('system-status').innerText = "REALTIME CONNECTED";
                document.getElementById('status-dot').classList.remove('bg-red-500');
                document.getElementById('status-dot').classList.add('bg-neonBlue');
            } catch (error) {
                console.error("Lỗi:", error);
                document.getElementById('system-status').innerText = "CONNECTION ERROR";
                document.getElementById('system-status').classList.add('text-red-500');
            }
        }

        // Hàm Parse dữ liệu CSV thuần túy
        function parseCSV(str) {
            const arr = [];
            let quote = false;
            let col = 0, row = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; }
                else if (cc == '"') { quote = !quote; }
                else if (cc == ',' && !quote) { ++col; }
                else if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; }
                else if (cc == '\n' && !quote) { ++row; col = 0; }
                else if (cc == '\r' && !quote) { ++row; col = 0; }
                else { arr[row][col] += cc; }
            }
            return arr;
        }

        function updateValueWithFlash(cardId, valId, newValue) {
            const el = document.getElementById(valId);
            const card = document.getElementById(cardId);
            const oldValue = parseInt(el.innerText) || 0;
            el.innerText = newValue;
            el.classList.remove('loading-pulse');
            if (newValue !== oldValue && oldValue !== 0) { 
                card.classList.add('data-updated');
                setTimeout(() => card.classList.remove('data-updated'), 1000);
            }
        }

        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('vi-VN', { hour12: false });
            const dateString = now.toLocaleDateString('vi-VN', { 
                weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' 
            });
            document.getElementById('realtime-clock').innerText = timeString;
            document.getElementById('realtime-date').innerText = dateString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        setInterval(() => {
            if (countdown <= 0) { fetchData(); countdown = 5; } else { countdown--; }
        }, 1000);

        fetchData();
    </script>
</body>
</html>
